name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: for file in scripts/*.sh; do bash -n "$file"; done
      - run: python3 -m json.tool config/tailscale-policy.example.json > /dev/null
